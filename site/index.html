<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#27823b"><meta name="description" content="Aruvi Housing Solutions business tracker"><link rel="manifest" href="manifest.json"><title>AHS — Aruvi Housing Solutions</title><style>
:root{--green:#27823b;--deep:#17652b;--pale:#eaf5ec;--bg:#f4f6f4;--ink:#243128;--muted:#718078;--line:#e3e9e4;--red:#d84b44;--blue:#2478c9;--shadow:0 2px 8px #182b1e12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:white;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1200px)/2));}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:38px;height:38px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 90px}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:0}.sub{color:var(--muted);margin:0 0 20px}.nav{display:flex;gap:6px;margin-bottom:22px;overflow:auto}.nav button{border:0;background:transparent;color:#59665e;padding:10px 15px;border-radius:9px;white-space:nowrap}.nav button.active{color:var(--deep);background:#e5f2e7;font-weight:650}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0}.card{background:#fff;border:1px solid #ebefeb;border-radius:13px;padding:18px;box-shadow:var(--shadow)}.hero{background:var(--green);color:white;grid-column:1/-1;padding:20px 22px}.hero .amount{font-size:34px;font-weight:750;margin:9px 0}.metric{min-height:105px}.metric .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.metric strong{display:block;font-size:25px;margin-top:9px}.green{color:var(--green)}.red{color:var(--red)}.stock{grid-column:1/-1}.stock-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.stock-chip{background:#eef7ef;padding:13px;border-radius:9px;text-align:center}.stock-chip:nth-child(2){background:#fff4e5}.stock-chip b{display:block;font-size:21px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;color:var(--ink)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.soft{background:var(--pale);color:var(--deep);border-color:transparent}.btn.danger{color:var(--red)}.btns{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:600}.empty{text-align:center;color:var(--muted);padding:34px 10px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#f0f3f0;font-size:12px}.pill.done{background:#e8f5e9;color:#267539}.pill.pending{background:#fff4df;color:#97620b}.modal{position:fixed;inset:0;background:#15201988;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:white;border-radius:14px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.dialog h2{margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#546259;font-weight:600}.field input,.field select{border:1px solid #d9e2da;border-radius:7px;padding:9px;background:white;min-width:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.section{margin-top:18px}.note{font-size:12px;color:var(--muted)}.backup{border-left:4px solid var(--green)}.report-filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.report-filters .field{min-width:145px}.hidden{display:none!important}.hamb{display:none}@media(max-width:680px){.wrap{padding:18px 13px 90px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.hero{grid-column:1/-1}.stock{grid-co </style></head><body><header><div class="brand"><img src="Source%20images/Aruvi%20Logo.png" alt="Aruvi logo"><div>AHS<small>Aruvi Housing Solutions</small></div></div><button class="btn soft" id="quickBackup">⬇ Backup</button></header><main class="wrap"><nav class="nav" id="nav"></nav><section id="view"></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="form"><div class="form" id="fields"></div><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script>
const KEY='ahs-data-v1',pages=['Dashboard','Projects','Transactions','Inventory','Partners'];let data=load(),page='Dashboard',editing=null,googleToken=null;function blank(){return{projects:[],transactions:[],purchases:[],partners:[],settings:{}}}function load(){try{return{...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const id=()=>crypto.randomUUID();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function balance(mode){return data.transactions.reduce((s,t)=>s+(t.mode===mode?(t.type==='Income'?+t.amount:-t.amount):0),0)}function received(p){return data.transactions.filter(t=>t.type==='Income'&&t.projectId===p.id).reduce((s,t)=>s+ +t.amount,0)}function projectProfit(p){let linked=data.transactions.filter(t=>t.projectId===p.id),income=linked.filter(t=>t.type==='Income').reduce((s,t)=>s+ +t.amount,0),expenses=linked.filter(t=>t.type==='Expense'&&t.category!=='Cash transfer').reduce((s,t)=>s+ +t.amount,0);return income-expenses}function bagTotals(type){let bought=data.purchases.filter(x=>x.type===type).reduce((s,x)=>s+ +x.qty,0),used=data.projects.reduce((s,p)=>s+p.bags.filter(b=>b.type===type).reduce((a,b)=>a+ +b.qty,0),0);return{bought,used,stock:bought-used}}function expenseTotal(){return data.transactions.filter(t=>t.type==='Expense').reduce((s,t)=>s+ +t.amount,0)}function receivable(){return data.projects.reduce((s,p)=>s+Math.max(0,+p.invoice-received(p)),0)}function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelector('#view').innerHTML=({Dashboard:dashboard,Projects:projects,Transactions:transactions,Inventory:inventory,Partners:partners})[page]();wire()}
function dashboard(){let b=balance('Bank')+balance('Petty Cash'),n=bagTotals('Naturoplast'),i=bagTotals('Irania');return `<h1>Dashboard</h1><p class="sub">Business overview</p><div class="grid metrics"><div class="card hero"><div>▣ &nbsp;TOTAL BALANCE</div><div class="amount">${money(b)}</div><div style="display:flex;justify-content:space-between;font-size:13px"><span>Bank: ${money(balance('Bank'))}</span><span>Petty Cash: ${money(balance('Petty Cash'))}</span></div></div><div class="card metric"><span class="label">Receivables</span><strong>${money(receivable())}</strong></div><div class="card metric"><span class="label">Total expenses</span><strong class="red">${money(expenseTotal())}</strong></div><div class="card metric"><span class="label">Total stock</span><strong>${n.stock+i.stock} bags</strong></div><div class="card stock"><h2>📦 Bags in stock</h2><div class="stock-row"><div class="stock-chip">Naturoplast<b>${n.stock}</b></div><div class="stock-chip">Irania<b>${i.stock}</b></div></div></div></div><div class="card backup"><div class="bar"><h2>Google Drive backup</h2><span class="pill" id="driveStatus">${data.settings.clientId?'Ready to connect':'Not connected'}</span></div><p class="note">Automatic backup runs every 24 hours while this app is open and Drive is connected.</p><div class="btns"><button class="btn primary" id="connectDrive">Connect Drive</button><button class="btn" id="backupNow">Back up now (.xlsx)</button><button class="btn" id="restoreFile">Restore from file</button><input id="restoreInput" type="file" accept=".xlsx,.xls" hidden></div><div class="section"><label class="note">Google OAuth Web Client ID (required for Drive):</label><div class="btns" style="margin-top:6px"><input id="clientId" placeholder="...apps.googleusercontent.com" value="${esc(data.settings.clientId||'')}" style="flex:1;min-width:220px;padding:9px;border:1px solid var(--line);border-radius:7px"><button class="btn soft" id="saveClient">Save ID</button></div><p class="note">See setup instructions in the project README.</p></div></div><div class="card section"><div class="bar"><h2>Reports</h2></div><div class="btns"><button class="btn" id="projectPdf">Project wise PDF</button><button class="btn" id="transactionPdf">Transactions PDF</button></div><div id="filters" class="section hidden"></div></div>`}
function projects(){return `<div class="bar"><div><h1>Projects</h1><p class="sub">Track work, materials and payments</p></div><button class="btn primary" id="addProject">＋ Add project</button></div><div class="card table-wrap"><table><thead><tr><th>Project</th><th>Initial area</th><th>Final area</th><th>Invoice</th><th>Received</th><th>Profit</th><th>Pending</th><th>Status</th><th></th></tr></thead><tbody>${data.projects.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="note">${p.bags.map(b=>`${esc(b.type)} ${b.qty}`).join(' · ')||'No bags recorded'}</div></td><td>${p.initial} sq ft</td><td>${p.final||0} sq ft</td><td>${money(p.invoice)}</td><td>${money(received(p))}</td><td>${money(Math.max(0,p.invoice-received(p)))}</td><td><span class="pill ${p.status==='Completed'?'done':'pending'}">${p.status}</span></td><td><button class="btn" data-edit-project="${p.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No projects yet. Add your first project.</td></tr>'}</tbody></table></div>`}
function transactions(){return `<div class="bar"><div><h1>Transactions</h1><p class="sub">One place for all business income and expenses</p></div><button class="btn primary" id="addTransaction">＋ Add transaction</button></div><div class="card table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Mode</th><th>Project</th><th>Category</th><th></th></tr></thead><tbody>${[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td class="${t.type==='Income'?'green':'red'}">${t.type}</td><td>${money(t.amount)}</td><td>${t.mode}</td><td>${esc(data.projects.find(p=>p.id===t.projectId)?.name||'—')}</td><td>${esc(t.category||'—')}</td><td><button class="btn danger" data-delete-tx="${t.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No transactions yet.</td></tr>'}</tbody></table></div>`}
function inventory(){let totals=['Naturoplast','Irania'].map(type=>({type,...bagTotals(type)}));return `<div class="bar"><div><h1>Inventory</h1><p class="sub">Bag purchases and project usage</p></div><button class="btn primary" id="addPurchase">＋ Record purchase</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:15px">${totals.map(t=>`<div class="card"><div class="label">${t.type}</div><strong style="font-size:27px">${t.stock}</strong><div class="note">Purchased ${t.bought} · Used ${t.used}</div></div>`).join('')}</div><div class="card table-wrap"><h2 style="margin-bottom:10px">Purchase history</h2><table><thead><tr><th>Date</th><th>Bag type</th><th>Quantity</th><th>Supplier / note</th></tr></thead><tbody>${data.purchases.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${x.qty}</td><td>${esc(x.note||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No purchases recorded.</td></tr>'}</tbody></table></div>`}
function partners(){return `<div class="bar"><div><h1>Partners</h1><p class="sub">Partner contributions and withdrawals</p></div><button class="btn primary" id="addPartner">＋ Add partner</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${data.partners.map(p=>{let inv=data.transactions.filter(t=>t.partnerId===p.id&&t.type==='Income').reduce((s,t)=>s+ +t.amount,0),out=data.transactions.filter(t=>t.partnerId===p.id&&t.type==='Expense').reduce((s,t)=>s+ +t.amount,0);return `<div class="card"><div class="bar"><h2>${esc(p.name)}</h2><button class="btn" data-partner-tx="${p.id}">＋ Record</button></div><div class="note">Investment ${money(inv)} · Withdrawals ${money(out)}</div><strong style="font-size:27px">${money(inv-out)}</strong><div class="note">Current balance</div></div>`}).join('')||'<div class="card empty">No partners added yet.</div>'}</div><p class="note section">Partner entries are tracked separately and do not affect bank or petty cash balances.</p>`}
const f=(name,label,type='text',opts={})=>`<div class="field ${opts.full?'full':''}"><label>${label}</label>${type==='select'?`<select name="${name}" ${opts.required===false?'':'required'}>${opts.options.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" ${opts.step?'step="'+opts.step+'"':''} ${opts.min!==undefined?'min="'+opts.min+'"':''} ${opts.required===false?'':'required'} ${opts.value!==undefined?'value="'+esc(opts.value)+'"':''} ${opts.placeholder?'placeholder="'+esc(opts.placeholder)+'"':''}>`}</div>`;function openModal(title,fields,handler){document.querySelector('#modalTitle').textContent=title;document.querySelector('#fields').innerHTML=fields;document.querySelector('#modal').classList.add('open');document.querySelector('#form').onsubmit=e=>{e.preventDefault();handler(Object.fromEntries(new FormData(e.target)));document.querySelector('#modal').classList.remove('open')}}
function wire(){const on=(id,fn)=>{let e=document.getElementById(id);if(e)e.onclick=fn};on('addProject',()=>projectForm());document.querySelectorAll('[data-edit-project]').forEach(b=>b.onclick=()=>projectForm(data.projects.find(p=>p.id===b.dataset.editProject)));on('addTransaction',()=>transactionForm());on('addPurchase',()=>openModal('Record bag purchase',f('date','Date','date',{value:new Date().toISOString().slice(0,10)})+f('type','Bag type','select',{options:[['Naturoplast','Naturoplast'],['Irania','Irania']]})+f('qty','Quantity','number',{min:1})+f('note','Supplier / note','text',{required:false,full:true}),v=>{data.purchases.push({...v,id:id(),qty:+v.qty});save()}));on('addPartner',()=>openModal('Add partner',f('name','Partner name'),v=>{data.partners.push({...v,id:id()});save()}));document.querySelectorAll('[data-partner-tx]').forEach(b=>b.onclick=()=>transactionForm(null,b.dataset.partnerTx));document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=()=>{data.transactions=data.transactions.filter(t=>t.id!==b.dataset.deleteTx);save()});on('cancel',()=>document.querySelector('#modal').classList.remove('open'));on('quickBackup',backupXlsx);on('backupNow',backupXlsx);on('restoreFile',()=>document.querySelector('#restoreInput').click());on('restoreInput',e=>e.target.onchange=restoreXlsx);on('saveClient',()=>{data.settings.clientId=document.querySelector('#clientId').value.trim();save();alert('Client ID saved.')});on('connectDrive',connectDrive);on('projectPdf',()=>{let list=data.projects;if(!list.length)return alert('Add a project before generating this report.');const d=new jspdf.jsPDF();d.text('Aruvi Housing Solutions — Project Report',14,16);let rows=list.map(p=>[p.name,p.initial,p.final||0,p.bags.map(b=>`${b.type} ${b.qty}`).join(', '),money(p.invoice),money(received(p)),money(Math.max(0,p.invoice-received(p))),p.status]);d.autoTable({head:[['Project','Initial sq ft','Final sq ft','Bags used','Invoiced','Received','Pending','Status']],body:rows,startY:23,styles:{fontSize:8}});d.save('AHS-project-report.pdf')});on('transactionPdf',showTransactionFilters);}
function projectForm(p){p=p||{bags:[]};openModal(p.id?'Edit project':'Add project',f('name','Project name','text',{value:p.name||''})+f('initial','Initial plaster area (sq. ft.)','number',{min:0,step:'0.01',value:p.initial||''})+f('final','Final plastered area (sq. ft.)','number',{min:0,step:'0.01',required:false,value:p.final||''})+f('invoice','Invoiced amount (₹)','number',{min:0,step:'0.01',value:p.invoice||0})+f('status','Status','select',{options:[['Pending','Pending'],['Completed','Completed']]})+`<div class="field full"><label>Bags used (add multiple entries)</label><div id="bagEntries">${(p.bags||[]).map(b=>bagRow(b.type,b.qty)).join('')}</div><button type="button" class="btn soft" id="addBagRow">＋ Add bag entry</button></div>`,v=>{let bags=[...document.querySelectorAll('.bag-entry')].map(x=>({type:x.querySelector('select').value,qty:+x.querySelector('input').value})).filter(x=>x.qty>0),obj={...p,...v,id:p.id||id(),initial:+v.initial,final:+v.final||0,invoice:+v.invoice,bags};if(p.id)data.projects[data.projects.findIndex(x=>x.id===p.id)]=obj;else data.projects.push(obj);save()});document.querySelector('#addBagRow').onclick=()=>document.querySelector('#bagEntries').insertAdjacentHTML('beforeend',bagRow('Naturoplast',''))}
function bagRow(type,qty){return `<div class="bag-entry btns" style="margin:6px 0"><select style="flex:1;padding:8px;border:1px solid var(--line);border-radius:7px"><option ${type==='Naturoplast'?'selected':''}>Naturoplast</option><option ${type==='Irania'?'selected':''}>Irania</option></select><input type="number" min="1" placeholder="Qty" value="${esc(qty)}" style="width:85px;padding:8px;border:1px solid var(--line);border-radius:7px"><button type="button" class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function transactionForm(prefill,partnerId){let pOptions=[['','None'],...data.projects.map(p=>[p.id,p.name])];openModal('Add transaction',f('date','Date','date',{value:new Date().toISOString().slice(0,10)})+f('type','Type','select',{options:[['Income','Income'],['Expense','Expense']]})+f('amount','Amount (₹)','number',{min:0.01,step:'0.01'})+f('mode','Mode','select',{options:[['Bank','Bank'],['Petty Cash','Petty Cash'],['Partner','Partner']]})+f('projectId','Linked project (optional)','select',{required:false,options:pOptions})+f('category','Expense category','select',{required:false,options:[['','None'],...['Bags','Labor','L/U','Transport','Materials','Rent','Electricity','Food','Misc'].map(x=>[x,x])]})+f('partnerId','Partner (if mode Partner)','select',{required:false,options:[['','Select partner'],...data.partners.map(p=>[p.id,p.name])]})+f('note','Note','text',{required:false,full:true}),v=>{if(v.type==='Income'&&v.mode==='Petty Cash'){data.transactions.push({...v,id:id(),mode:'Bank',type:'Expense',category:'Cash transfer',note:'Transfer to petty cash'});data.transactions.push({...v,id:id(),mode:'Petty Cash',type:'Income',category:'Cash transfer',note:'Transfer from bank'})}else data.transactions.push({...v,id:id(),amount:+v.amount,partnerId:v.mode==='Partner'?v.partnerId:''});save()})}
async function backupXlsx(){if(!window.XLSX)return alert('Spreadsheet library could not load. Connect to the internet and retry.');const wb=XLSX.utils.book_new();for(const key of ['projects','transactions','purchases','partners'])XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data[key]),key[0].toUpperCase()+key.slice(1));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{exportedAt:new Date().toISOString(),version:1}]),'Backup Info');let bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'}),blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),file=new File([blob],`AHS-backup-${new Date().toISOString().slice(0,10)}.xlsx`,{type:blob.type});if(googleToken){try{await uploadDrive(file);alert('Backup saved to Google Drive.')}catch(e){console.error(e);download(file);alert('Drive upload failed; an Excel backup was downloaded instead.')}}else download(file)}function download(file){let a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restoreXlsx(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let wb=XLSX.read(reader.result,{type:'array'}),next=blank();for(let key of ['projects','transactions','purchases','partners']){let sheet=key[0].toUpperCase()+key.slice(1);if(wb.Sheets[sheet])next[key]=XLSX.utils.sheet_to_json(wb.Sheets[sheet])}next.settings=data.settings;if(!confirm('Restore this backup and replace the data currently on this device?'))return;data=next;save();alert('Backup restored.')}catch(err){alert('This file could not be read as an AHS backup.')}};reader.readAsArrayBuffer(file)}
function showTransactionFilters(){let el=document.querySelector('#filters');el.classList.remove('hidden');el.innerHTML=`<div class="report-filters">${f('from','From','date',{value:new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10)})}${f('to','To','date',{value:new Date().toISOString().slice(0,10)})}${f('mode','Account','select',{options:[['All','All accounts'],['Bank','Bank'],['Petty Cash','Petty Cash']]})}<button class="btn primary" id="makeTxPdf">Generate PDF</button></div>`;el.querySelector('#makeTxPdf').onclick=()=>{let from=el.querySelector('[name=from]').value,to=el.querySelector('[name=to]').value,mode=el.querySelector('[name=mode]').value,list=data.transactions.filter(t=>t.date>=from&&t.date<=to&&(mode==='All'||t.mode===mode));const d=new jspdf.jsPDF();d.text(`AHS Transactions — ${mode} — ${from} to ${to}`,14,16);d.autoTable({head:[['Date','Type','Amount','Mode','Project','Category','Note']],body:list.map(t=>[t.date,t.type,money(t.amount),t.mode,data.projects.find(p=>p.id===t.projectId)?.name||'',t.category||'',t.note||'']),startY:23,styles:{fontSize:8}});d.save('AHS-transactions.pdf')}}

function dashboard(){let b=balance('Bank')+balance('Petty Cash'),n=bagTotals('Naturoplast'),i=bagTotals('Irania'),active=data.projects.filter(p=>p.status!=='Completed'),area=active.reduce((s,p)=>s+(Number(p.final)>0?Number(p.final):Number(p.initial)||0),0),invoice=active.reduce((s,p)=>s+projectQuote(p),0),receivedTotal=active.reduce((s,p)=>s+received(p),0);return `<h1>Dashboard</h1><p class="sub">Business overview</p><div class="grid metrics"><div class="card hero"><div>▣ &nbsp;TOTAL BALANCE</div><div class="amount">${money(b)}</div><div style="display:flex;justify-content:space-between;font-size:13px"><span>Bank: ${money(balance('Bank'))}</span><span>Petty Cash: ${money(balance('Petty Cash'))}</span></div></div><div class="card metric"><span class="label">Receivables</span><strong>${money(receivable())}</strong></div><div class="card metric"><span class="label">Total expenses</span><strong class="red">${money(expenseTotal())}</strong></div><div class="card metric"><span class="label">Total stock</span><strong>${n.stock+i.stock} bags</strong></div><div class="card stock"><h2>📦 Bags in stock</h2><div class="stock-row"><div class="stock-chip">Naturoplast<b>${n.stock}</b></div><div class="stock-chip">Irania<b>${i.stock}</b></div></div></div></div><div class="card section table-wrap"><div class="bar"><div><h2>Active projects</h2><div class="note">Total area: ${area.toLocaleString('en-IN')} sq. ft.</div></div></div><table><thead><tr><th>Project</th><th>Area (sq. ft.)</th><th>Total invoiced</th><th>Amount received</th><th>Pending</th></tr></thead><tbody>${active.map(p=>`<tr><td>${esc(p.name)}</td><td>${(Number(p.final)>0?Number(p.final):Number(p.initial)||0).toLocaleString('en-IN')}</td><td>${money(projectQuote(p))}</td><td>${money(received(p))}</td><td class="${projectProfit(p)<0?'red':'green'}">${money(projectProfit(p))}</td><td>${money(Math.max(0,projectQuote(p)-received(p)))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No active projects.</td></tr>'}<tr><th>Total</th><th>${area.toLocaleString('en-IN')}</th><th>${money(invoice)}</th><th>${money(receivedTotal)}</th><th>${money(Math.max(0,invoice-receivedTotal))}</th></tr></tbody></table></div><div class="card backup section"><div class="bar"><h2>Google Drive backup</h2><span class="pill" id="driveStatus">${data.settings.clientId?'Ready to connect':'Not connected'}</span></div><p class="note">Automatic backup runs every 24 hours while this app is open and Drive is connected.</p><div class="btns"><button class="btn primary" id="connectDrive">Connect Drive</button><button class="btn" id="backupNow">Back up now (.xlsx)</button><button class="btn" id="restoreFile">Restore from file</button><input id="restoreInput" type="file" accept=".xlsx,.xls" hidden></div><div class="section"><label class="note">Google OAuth Web Client ID (required for Drive):</label><div class="btns" style="margin-top:6px"><input id="clientId" placeholder="...apps.googleusercontent.com" value="${esc(data.settings.clientId||'')}" style="flex:1;min-width:220px;padding:9px;border:1px solid var(--line);border-radius:7px"><button class="btn soft" id="saveClient">Save ID</button></div><p class="note">See setup instructions in the project README.</p></div></div><div class="card section"><div class="bar"><h2>Reports</h2></div><div class="btns"><button class="btn" id="projectPdf">Project wise PDF</button><button class="btn" id="transactionPdf">Transactions PDF</button></div><div id="filters" class="section hidden"></div></div>`}
function projectTableRows(list){return list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="note">Used: ${(p.bags||[]).map(x=>`${esc(x.type)} ${x.qty}${x.date?' · '+esc(x.date):''}`).join(', ')||'—'}<br>Returned: ${(p.bagReturns||[]).map(x=>`${esc(x.type)} ${x.qty}${x.date?' · '+esc(x.date):''}`).join(', ')||'—'}</div></td><td>${p.initial} sq ft</td><td>${p.final||0} sq ft</td><td>${money(p.rate||0)}</td><td>${money(projectQuote(p))}</td><td>${money(received(p))}</td><td>${money(Math.max(0,projectQuote(p)-received(p)))}</td><td><span class="pill ${p.status==='Completed'?'done':'pending'}">${esc(p.status)}</span></td><td><button class="btn" data-edit-project="${p.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No projects in this section.</td></tr>'}
function projects(){let pending=data.projects.filter(p=>p.status!=='Completed'),completed=data.projects.filter(p=>p.status==='Completed');return `<div class="bar"><div><h1>Projects</h1><p class="sub">Track work, pricing, materials and payments</p></div><button class="btn primary" id="addProject">＋ Add project</button></div><div class="card table-wrap"><h2 style="margin:0 0 12px">Pending Projects</h2><table><thead><tr><th>Project</th><th>Initial area</th><th>Final area</th><th>Rate / sq. ft.</th><th>Price quoted</th><th>Received</th><th>Pending</th><th>Status</th><th></th></tr></thead><tbody>${projectTableRows(pending)}</tbody></table></div><details class="card section"><summary style="cursor:pointer;font-weight:700">Completed Projects (${completed.length})</summary><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Project</th><th>Initial area</th><th>Final area</th><th>Rate / sq. ft.</th><th>Price quoted</th><th>Received</th><th>Pending</th><th>Status</th><th></th></tr></thead><tbody>${projectTableRows(completed)}</tbody></table></div></details>`}
function transactions(){return `<div class="bar"><div><h1>Transactions</h1><p class="sub">One place for all business income and expenses</p></div><button class="btn primary" id="addTransaction">＋ Add transaction</button></div><div class="card table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Mode</th><th>Project</th><th>Category</th><th>Partner</th><th></th></tr></thead><tbody>${[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td class="${t.type==='Income'?'green':'red'}">${esc(t.type)}</td><td>${money(t.amount)}</td><td>${esc(t.mode)}</td><td>${esc(data.projects.find(p=>p.id===t.projectId)?.name||'—')}</td><td>${esc(t.category||'—')}</td><td>${esc(data.partners.find(p=>p.id===t.partnerId)?.name||'—')}</td><td><div class="btns"><button class="btn" data-edit-tx="${t.id}">Edit</button><button class="btn danger" data-delete-tx="${t.id}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No transactions yet.</td></tr>'}</tbody></table></div>`}
function inventory(){let totals=['Naturoplast','Irania'].map(type=>({type,...bagTotals(type)}));return `<div class="bar"><div><h1>Inventory</h1><p class="sub">Bag purchases and project usage</p></div><button class="btn primary" id="addPurchase">＋ Record purchase</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:15px">${totals.map(t=>`<div class="card"><div class="label">${t.type}</div><strong style="font-size:27px">${t.stock}</strong><div class="note">Purchased ${t.bought} · Returned ${t.returned} · Used ${t.used}</div></div>`).join('')}</div><div class="card table-wrap"><h2 style="margin-bottom:10px">Purchase history</h2><table><thead><tr><th>Date</th><th>Bag type</th><th>Quantity</th><th>Supplier / note</th><th></th></tr></thead><tbody>${data.purchases.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${x.qty}</td><td>${esc(x.note||'—')}</td><td><div class="btns"><button class="btn" data-edit-purchase="${x.id}">Edit</button><button class="btn danger" data-delete-purchase="${x.id}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No purchases recorded.</td></tr>'}</tbody></table></div>`}
function editTransaction(t){let pOptions=[['','None'],...data.projects.map(p=>[p.id,p.name])],partnerOptions=[['','Select partner'],...data.partners.map(p=>[p.id,p.name])],cats=['Bags','Labor','L/U','Transport','Materials','Rent','Electricity','Food','Misc','Cash transfer'];openModal('Edit transaction',f('date','Date','date',{value:t.date})+f('type','Type','select',{options:[['Income','Income'],['Expense','Expense']]})+f('amount','Amount (₹)','number',{min:0.01,step:'0.01',value:t.amount})+f('mode','Mode','select',{options:[['Bank','Bank'],['Petty Cash','Petty Cash'],['Partner','Partner']]})+f('projectId','Linked project (optional)','select',{required:false,options:pOptions})+f('category','Category','select',{required:false,options:[['','None'],...cats.map(x=>[x,x])]})+f('partnerId','Partner','select',{required:false,options:partnerOptions})+f('note','Note','text',{required:false,full:true,value:t.note||''}),v=>{let updated={...t,...v,amount:+v.amount,partnerId:v.mode==='Partner'?v.partnerId:''};data.transactions[data.transactions.findIndex(x=>x.id===t.id)]=updated;if(t.category==='Cash transfer'){let mate=data.transactions.find(x=>x.id!==t.id&&x.category==='Cash transfer'&&x.date===t.date&&+x.amount===+t.amount&&x.projectId===t.projectId&&x.mode!==t.mode&&x.type!==t.type);if(mate){mate.date=v.date;mate.amount=+v.amount;mate.projectId=v.projectId;mate.note=updated.mode==='Bank'?'Transfer to petty cash':'Transfer from bank'}}save()});for(let [name,value] of Object.entries({type:t.type,mode:t.mode,projectId:t.projectId||'',category:t.category||'',partnerId:t.partnerId||''})){let el=document.querySelector(`[name="${name}"]`);if(el)el.value=value}}
function editPurchase(p){openModal('Edit inventory purchase',f('date','Date','date',{value:p.date})+f('type','Bag type','select',{options:[['Naturoplast','Naturoplast'],['Irania','Irania']]})+f('qty','Quantity','number',{min:1,value:p.qty})+f('note','Supplier / note','text',{required:false,full:true,value:p.note||''}),v=>{data.purchases[data.purchases.findIndex(x=>x.id===p.id)]={...p,...v,qty:+v.qty};save()});document.querySelector('[name=type]').value=p.type}
document.addEventListener('click',function(e){let b=e.target.closest('[data-edit-tx],[data-edit-purchase],[data-delete-purchase]');if(!b)return;if(b.dataset.editTx){let t=data.transactions.find(x=>x.id===b.dataset.editTx);if(t)editTransaction(t)}else if(b.dataset.editPurchase){let p=data.purchases.find(x=>x.id===b.dataset.editPurchase);if(p)editPurchase(p)}else if(b.dataset.deletePurchase){let p=data.purchases.find(x=>x.id===b.dataset.deletePurchase);if(p&&confirm(`Delete the ${p.qty} ${p.type} purchase dated ${p.date}? Inventory stock will be recalculated.`)){data.purchases=data.purchases.filter(x=>x.id!==p.id);save()}}});
</script></body></html>
